<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>фотоальбомМ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="book-container">

    <h1>фотоальбом</h1>

    <div class="book">

        <div class="spread active">
            <div class="photo-frame">
                <img src="images/photo1.jpg">
            </div>
            <div class="photo-frame">
                <img src="images/photo2.jpg">
            </div>
        </div>

        <div class="spread">
            <div class="photo-frame">
                <img src="images/photo3.jpg">
            </div>
            <div class="photo-frame">
                <img src="images/photo4.jpg">
            </div>
        </div>

        <div class="spread">
            <div class="photo-frame">
                <img src="images/photo5.jpg">
            </div>
            <div class="photo-frame">
                <img src="images/photo6.jpg">
            </div>
        </div>

        <div class="spread">
            <div class="photo-frame">
                <img src="images/photo7.jpg">
            </div>
            <div class="photo-frame">
                <img src="images/photo8.jpg">
            </div>
        </div>

        <div class="spread">
            <div class="photo-frame single">
                <img src="images/photo9.jpg">
            </div>
        </div>

    </div>

    <div class="navigation">
        <button id="prev">← Назад</button>
        <span id="pageCounter">1 / 5</span>
        <button id="next">Вперёд →</button>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
